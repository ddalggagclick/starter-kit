# 책임: [통합] 세 Python 패키지를 동시에 설치하는 uv Workspace 실행 진입점.
# 구현할 기능: 루트 uv sync 한 번으로 Backend·LLM·RAG를 설치한다.
# 완료 기준: uv sync 후 uv run uvicorn / starter-llm / starter-rag 명령을 찾을 수 있다.
[project]
name = "inheritance-starter-workspace"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["inheritance-backend", "starter-llm", "starter-rag"]

[tool.uv]
managed = true
package = false

[tool.uv.workspace]
members = ["backend", "llm", "rag"]

[tool.uv.sources]
inheritance-backend = { workspace = true }
starter-llm = { workspace = true }
starter-rag = { workspace = true }

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "ruff>=0.13,<1",
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "starter-rag[ingestion]",
    "starter-llm[ollama]",  # 로컬 개발용 추가 기능; 운영 설치에서는 제외
]
bootstrap = ["cryptography>=44,<51"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
