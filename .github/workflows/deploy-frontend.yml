# 담당: [통합] | 책임: 프런트 배포 경계 — 지금은 수동 실행 전용.
# 프런트(gil-web)는 Vercel Git 연동 + Ignored Build Step(main만 빌드)으로 배포한다.
# 프런트 개발이 끝나고 팀이 Actions 배포로 옮기기로 하면 backend와 같은 방식으로 활성화한다.
name: Frontend deploy (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deployment-contract-only:
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "Frontend CD는 Vercel Git 연동(main만 빌드)을 사용한다. Actions 배포는 비활성."
