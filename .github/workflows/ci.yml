# 담당: [통합] | 책임: [통합] 계약 단계 CI
# 구현할 기능: 의존 경계·문서·정적 타입 검사 기준; API 계약 확정 후 OpenAPI diff 추가
# 코드 경계: CI/CD 자동화만 작성한다. 서비스 비밀값을 커밋하지 않는다.
# 완료 기준: 모의 CI/Workflow 점검 및 시크릿 비노출 확인.
# 상태: Contract-first — 구현은 소유 담당자 PR에서 진행
name: Contracts checks
on: [pull_request, push]
jobs:
  contract-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/verify_contracts.py
