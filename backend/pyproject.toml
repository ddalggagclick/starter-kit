# 담당: [통합] | 책임: [통합] 상속 전용 FastAPI 패키지 선언
# 구현할 기능: Python 패키지 메타데이터 및 워크스페이스 경로; HTTP/인증/DB의 승인된 직접 의존성을 최초 설치 때 일괄 설치
# 코드 경계: 워크스페이스·의존성 선언만 관리한다. 기능 로직은 소스 디렉터리에 둔다.
# 완료 기준: 정상·오류·권한/저장 실패 계약 테스트 통과.
# 상태: Contract-first — 구현은 소유 담당자 PR에서 진행
[project]
name = "inheritance-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "SQLAlchemy>=2.0,<3",
    "asyncpg>=0.30,<1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.13,<2",
    "PyJWT[crypto]>=2.9,<3",
    "pwdlib[argon2]>=0.2,<1",
    "email-validator>=2,<3",
    "httpx>=0.27,<1",
    "langchain-mcp-adapters>=0.3.2,<0.4",  # Python LangChain MCP 어댑터
    "mcp>=1.24,<2",  # MCP SDK 2.x와 어댑터 조합 충돌 방지
    "starter-llm",
    "starter-rag",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inheritance"]
