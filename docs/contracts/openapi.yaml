components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Access 토큰(15분)
  responses:
    ValidationError:
      description: VALIDATION_ERROR (입력 누락·형식 오류, 협의 13)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    HandoffUnauthorized:
      description: 비밀값 불일치 (코드 UNAUTHENTICATED)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: core/errors.py 코드
        message:
          type: string
        requestId:
          type: string
    RateLimitReason:
      type: string
      description: 429 RATE_LIMITED의 message 값(사유 구분 키, 화면 문구 아님). GUEST_DAILY_LIMIT=비로그인 하루 10회(#138), MEMBER_MINUTE_LIMIT=로그인 사용자 1분 10회(#143)
      enum:
        - GUEST_DAILY_LIMIT
        - MEMBER_MINUTE_LIMIT
    RateLimitError:
      type: object
      description: A08 429 본문. code가 RATE_LIMITED면 message는 RateLimitReason, PROVIDER_RATE_LIMIT면 코드 이름
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - RATE_LIMITED
            - PROVIDER_RATE_LIMIT
        message:
          anyOf:
            - $ref: "#/components/schemas/RateLimitReason"
            - type: string
              enum:
                - PROVIDER_RATE_LIMIT
        requestId:
          type: string
    Relationship:
      type: string
      enum:
        - spouse
        - descendant
        - ascendant
        - sibling
        - other
        - unknown
    AnswerChoice:
      type: string
      enum:
        - "yes"
        - "no"
        - unknown
    RiskId:
      type: string
      enum:
        - debt
        - property_disposal
        - self_application
    ProcedureId:
      type: string
      enum:
        - p01
        - p02
        - p03
        - p04
        - p05
        - p06
        - p07
        - p08
      description: 코드 기준. 협의 H4의 영문 이름과의 대응은 D6 보류
    HandoffPayload:
      type: object
      required:
        - relationship
        - deathDate
        - deathDateUnknown
        - oneStopApplication
      description: "JSON 이름은 camelCase(I01), 값은 contracts/domain.py 기준.

        deathDate가 null이면 deathDateUnknown은 true, 날짜가 있으면 false여야 합니다(불일치는 422).

        "
      properties:
        relationship:
          $ref: "#/components/schemas/Relationship"
        deathDate:
          type: string
          format: date
          nullable: true
          example: "2026-09-30"
        deathDateUnknown:
          type: boolean
        oneStopApplication:
          $ref: "#/components/schemas/AnswerChoice"
        risks:
          type: array
          description: 답한 위험 질문만 포함
          items:
            type: object
            required:
              - riskId
              - answer
            properties:
              riskId:
                $ref: "#/components/schemas/RiskId"
              answer:
                $ref: "#/components/schemas/AnswerChoice"
    ProcedureDetail:
      type: object
      properties:
        procedureId:
          $ref: "#/components/schemas/ProcedureId"
        action:
          type: string
          description: 바로 할 행동
        deadline:
          type: string
          description: 기한
        risk:
          type: string
          description: 위험
        agency:
          type: string
          description: 담당 기관
        documents:
          type: array
          items:
            type: string
        methods:
          type: array
          items:
            type: string
        exceptions:
          type: array
          items:
            type: string
        contacts:
          type: array
          items:
            type: string
        officialLinks:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              url:
                type: string
                format: uri
        relatedProcedureIds:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/ProcedureId"
          description: 함께 보면 좋은 절차 0~3개 (필드 이름·저장 위치는 제안, D4 보류)
        contentVersion:
          $ref: "#/components/schemas/ContentVersion"
    ContentVersion:
      type: string
      example: q98-f1c0959+su-v0.5
      description: 안내 콘텐츠 버전(A07 목록·상세에 항상 포함, #148). 카카오 체크리스트 규칙과 같은 값(checklist/rules.py CONTENT_VERSION 한 곳에서 정함). 값이 바뀌면 안내가 갱신된 것
    SseEvents:
      description: text/event-stream 한 건의 data. 이벤트 이름(event:)에 따라 아래 중 하나입니다.
      oneOf:
        - $ref: "#/components/schemas/SseStatusEvent"
        - $ref: "#/components/schemas/SseResultEvent"
        - $ref: "#/components/schemas/SseErrorEvent"
    KakaoSkillRequest:
      type: object
      description: 카카오 오픈빌더 스킬 요청 중 이 서버가 읽는 필드만 적었습니다.
      properties:
        userRequest:
          type: object
          properties:
            utterance:
              type: string
              description: 사용자가 누른 버튼 문구 또는 직접 입력
            block:
              type: object
              properties:
                name:
                  type: string
                  description: 블록 이름(웰컴 블록 구분)
            user:
              type: object
              properties:
                id:
                  type: string
                  description: 서버 메모리에서만 사용. 로그·저장 금지
    KakaoSkillResponse:
      type: object
      required:
        - version
        - template
      properties:
        version:
          type: string
          example: "2.0"
        template:
          type: object
          properties:
            outputs:
              type: array
              items:
                type: object
                description: simpleText 또는 textCard
            quickReplies:
              type: array
              maxItems: 10
              items:
                type: object
                properties:
                  label:
                    type: string
                  action:
                    type: string
                    example: message
                  messageText:
                    type: string
    ChecklistSave:
      type: object
      required:
        - itemStates
        - serverSaveConsent
      properties:
        itemStates:
          type: array
          items:
            type: object
          description: 체크리스트 개별 상태
        serverSaveConsent:
          type: boolean
          description: 서버 저장 동의 여부. 로그인했을 때만 저장
    ChecklistSaved:
      type: object
      properties:
        itemStates:
          type: array
          items:
            type: object
        serverSaveConsent:
          type: boolean
          description: 서버 저장 동의 상태
    SseStatusEvent:
      type: object
      description: "event: status (여러 번)"
      required:
        - stage
      properties:
        stage:
          type: string
          enum:
            - searching
            - lawChecking
            - writing
    SseSource:
      type: object
      properties:
        title:
          type: string
        url:
          type: string
          format: uri
          nullable: true
          description: 공식 HTTPS 주소. 안내 자료 출처는 URL이 없으면 null(전화번호·기관 안내 등, #96). 법령 출처는 항상 있음
      description: 출처 제목과 공식 주소
    SseResultEvent:
      type: object
      description: "event: result (1번). 출처 0개면 state=withheld"
      required:
        - state
      properties:
        state:
          type: string
          enum:
            - answered
            - withheld
        answer:
          type: string
          nullable: true
          description: 검증된 답변 본문. 인용은 `[n]`(1부터) 표시이고 `sources[n-1]`을 가리킨다. 같은 출처는 같은 번호. 내부 근거 ID는 포함하지 않는다
          example: 상속포기는 가정법원에 신고합니다[1]. 기간은 민법 조문을 따릅니다[2].
        sources:
          type: array
          description: 본문에서 처음 인용된 순서
          items:
            $ref: "#/components/schemas/SseSource"
        remainingToday:
          type: integer
          nullable: true
          description: 비로그인은 하루 10회 중 이번 질문까지 센 뒤 남은 횟수(KST 자정 초기화, A10·J2). 로그인 사용자는 null(1분 10회 제한은 429로만 알림)
        reasonCode:
          type: string
          nullable: true
          enum:
            - SOURCE_NOT_VERIFIED
            - CITATION_MISMATCH
            - null
          description: withheld일 때 사유 (S7)
    SseErrorEvent:
      type: object
      description: "event: error (1번)"
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - RATE_LIMITED
            - PROVIDER_RATE_LIMIT
            - PROVIDER_UNAVAILABLE
            - PROVIDER_TIMEOUT
        message:
          type: string
        requestId:
          type: string
