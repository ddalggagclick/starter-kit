openapi: 3.0.3
info:
  title: 상속 길잡이 API 명세서
  version: 0.2.1-draft (2026-10-22)
  description:
    "PRD 7-1-5 (Swagger 기준 API 상세 입력·응답·오류 명세). 작성: 김선(B2/C), 공동: 김현주(B1/API), 이정민(F1).\n- 값 이름(relationship, riskId\
    \ 등)은 팀 코드 `backend/src/inheritance/contracts/domain.py`, 오류 코드는 `core/errors.py` 기준입니다.\n- `x-status`: 협의완료 / 일부 / 제안\
    \ / 보류. 제안·보류 항목은 확정이 아닙니다. 확정은 API 담당(김현주) 승인 후 표시합니다.\n- 경로가 \"제안\"인 항목은 팀 코드에 아직 라우터가 없습니다.\n- 로그에 사용자 질문 원문, 토큰, 카카오\
    \ 사용자 ID를 남기지 않습니다.\n\n    - 카카오 스킬 서버는 우선 별도 서버로 운영하고, 백엔드와 합칠지는 최종 단계에서 결정합니다(10/21 김선). 합치기 전까지 `/skill`은 이 문서에 있어도\
    \ 백엔드 OpenAPI(`/openapi.json`)에는 나타나지 않습니다.\n    - `x-confirmed`: true는 10/20 협의 완료, false는 제안·보류. `x-path-proposed`:\
    \ true는 경로 이름이 제안(팀 코드에 라우터 없음)."
servers:
  - url: http://127.0.0.1:8000
    description: 백엔드(로컬)
  - url: https://kakaogil.onrender.com
    description: 카카오 스킬 서버(별도 Render). 최종 단계에서 백엔드와 합칠지 결정
tags:
  - name: kakao
    description: 카카오 스킬 (김선)
  - name: handoff
    description: 카카오→웹 인계 (구현 김현주 / 호출 김선·이정민)
  - name: procedures
    description: 절차 안내
  - name: ai
    description: AI 질문 (SSE)
  - name: auth
    description: 인증
  - name: account
    description: 계정 데이터
  - name: common
    description: 공통
paths:
  /skill:
    post:
      tags:
        - kakao
      operationId: A01_A02_A03_kakaoSkill
      summary: A01~A03 카카오 스킬 (초기 3문항, 위험 질문 3종, 절차 카드)
      x-status: 협의완료 (10/20)
      description:
        '카카오 오픈빌더가 호출합니다. 호출자: 카카오. 서버: `kakao/**` (김선).

        한 사용자의 진행 상태(질문 단계)는 서버 메모리의 세션에만 두며 저장하지 않습니다.

        응답 말풍선 순서: 위험 경고 → 절차 목록 → 추가 확인 (협의 12).

        5초 안에 응답해야 하며, 초과·실패 시 카카오가 대체 말풍선을 보여주고 서버는 "다시 시도 / 웹에서 시작하기"를 안내합니다.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KakaoSkillRequest"
      responses:
        "200":
          description: 카카오 스킬 응답 v2.0 (오류가 나도 200과 안전한 안내 말풍선을 돌려줌)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KakaoSkillResponse"
      x-confirmed: true
      x-path-proposed: false
  /api/handoff:
    post:
      tags:
        - handoff
      operationId: A04_issueHandoff
      summary: A04 인계 토큰 발급 (카카오 서버 → 백엔드, 서버 간 호출)
      x-status: 협의완료 · 구현 완료 (헤더 X-Handoff-Secret)
      description:
        "웹 공개 API가 아닙니다. 사용자가 카카오에서 [웹 체크리스트에서 보기]를 누른 시점에 호출합니다.

        토큰은 의미 없는 임의 문자열이며 서버 메모리에 10분, 1회만 보관합니다(재시작 시 유실될 수 있음).

        웹 링크: `{FRONTEND_ORIGIN}/checklist?handoff=<token>` (J1).

        "
      parameters:
        - name: X-Handoff-Secret
          in: header
          required: true
          description: 서버 간 비밀값(HANDOFF_SERVER_SECRET). 로그 금지.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HandoffPayload"
            example:
              relationship: descendant
              deathDate: "2026-09-30"
              deathDateUnknown: false
              oneStopApplication: unknown
              risks:
                - riskId: property_disposal
                  answer: "yes"
      responses:
        "200":
          description: 발급 성공
          content:
            application/json:
              schema:
                type: object
                required:
                  - token
                  - expiresInSeconds
                properties:
                  token:
                    type: string
                    description: 불투명 문자열
                  expiresInSeconds:
                    type: integer
                    example: 600
        "401":
          $ref: "#/components/responses/HandoffUnauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
      x-confirmed: true
      x-path-proposed: false
  /api/handoff/exchange:
    post:
      tags:
        - handoff
      operationId: A05_exchangeHandoff
      summary: A05 인계 토큰 교환 (웹 진입 시 1회)
      x-status: 협의완료 · 구현 완료 · 오류 400 확정(D1)
      description:
        "웹(이정민)이 링크의 `handoff` 값을 읽어 본문으로 보내고, 주소에서 토큰을 지웁니다(J3).

        성공 즉시 토큰이 무효가 되며, 동시에 2번 보내면 1번만 성공합니다.

        만료·이미 사용·없는 토큰은 모두 같은 코드·같은 응답입니다.

        "
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
      responses:
        "200":
          description: 카카오에서 답한 내용
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandoffPayload"
        "400":
          description: HANDOFF_INVALID (core/errors.py)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: HANDOFF_INVALID
                message: 연결이 만료되었거나 이미 사용되었습니다.
      x-confirmed: true
      x-path-proposed: false
  /api/procedures:
    get:
      tags:
        - procedures
      operationId: A07_listProcedures
      summary: A07 절차 8개 목록
      x-status: 협의완료 (10/22 김현주 확인 - 경로와 절차 ID p01~p08 확정, 백엔드·프론트 동일 경로 사용)
      responses:
        "200":
          description: 고정 8개 절차
          content:
            application/json:
              schema:
                type: object
                properties:
                  procedures:
                    type: array
                    minItems: 8
                    maxItems: 8
                    items:
                      type: object
                      properties:
                        procedureId:
                          $ref: "#/components/schemas/ProcedureId"
                        name:
                          type: string
                        summary:
                          type: string
                  contentVersion:
                    $ref: "#/components/schemas/ContentVersion"
      x-confirmed: true
      x-path-proposed: false
  /api/procedures/{procedureId}:
    get:
      tags:
        - procedures
      operationId: A07_getProcedure
      summary: A07 절차 상세
      x-status: 협의완료 (10/22 김현주 확인 - 경로와 절차 ID p01~p08 확정, 백엔드·프론트 동일 경로 사용)
      parameters:
        - name: procedureId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ProcedureId"
      responses:
        "200":
          description: 항상 표시 4개 + 접는 항목(4건 이상이면 접음)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcedureDetail"
        "422":
          description: VALIDATION_ERROR (p01~p08이 아닌 절차 ID는 경로 검증 단계에서 거부. 팀 오류 코드에 없는 404는 만들지 않음, 김현주 10/22)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-confirmed: true
      x-path-proposed: false
  /api/ai/ask:
    post:
      tags:
        - ai
      operationId: A08_askAi
      summary: A08 AI 질문 (분류→검색→답변, SSE 수신)
      x-status: 협의완료 (10/20) · 구현 완료
      description:
        "응답은 `text/event-stream`. 이벤트는 status → result 또는 error.

        연결을 끊으면 해당 요청이 취소됩니다(A09는 별도 API 없음). 남은 횟수(A10)는 result에 포함됩니다.

        검증된 완성 답변만 전송하며, 출처 0개면 `withheld`(판단 유보, 오류 아님).

        Gemini 429는 자동 모델 전환·무한 재시도 없이 사용 제한 상태(S9)로 전환합니다.

        "
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - question
                - requestId
              properties:
                question:
                  type: string
                  maxLength: 200
                  description: 최대 200 코드포인트
                requestId:
                  type: string
                  description: 화면이 만드는 요청 번호(늦은 응답 차단용)
                previousQuestions:
                  type: array
                  maxItems: 3
                  items:
                    type: string
                  description: 같은 채팅의 이전 사용자 질문 0~3개 (협의 7)
      responses:
        "200":
          description: SSE 스트림
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/SseEvents"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          description:
            "스트림 시작 전 HTTP 429. code로 구분하고, RATE_LIMITED는 message에 사유 키(RateLimitReason)가 온다(3-7-3).

            - RATE_LIMITED + GUEST_DAILY_LIMIT: 비로그인 하루 10회 초과(#138)

            - RATE_LIMITED + MEMBER_MINUTE_LIMIT: 로그인 사용자 1분 10회 초과(#143)

            - PROVIDER_RATE_LIMIT: 공급자 한도(S9). 스트림 시작 후에는 error 이벤트로 온다

            message는 화면 문구가 아니라 사유 구분 키다."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitError"
        "503":
          description: PROVIDER_UNAVAILABLE (D2 확정)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          description: PROVIDER_TIMEOUT (D2 확정)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-confirmed: true
      x-path-proposed: false
  /api/auth/csrf:
    get:
      tags:
        - auth
      operationId: auth_csrf
      summary: CSRF 토큰 발급
      x-status: 구현 완료
      description:
        "상태를 바꾸는 인증·계정 요청(A11~A16, A17 PUT·DELETE) 전에 호출합니다.

        HttpOnly CSRF 쿠키를 심고 같은 토큰을 본문 csrfToken으로 돌려줍니다. 유효한 쿠키가 있으면 같은 토큰을 다시 줍니다.

        화면은 이 값을 `X-CSRF-Token` 헤더로 보냅니다. 쿠키와 헤더가 없거나 다르면 403 CSRF_INVALID, 허용되지 않은 Origin이면 403 ORIGIN_FORBIDDEN입니다.

        응답은 Cache-Control: no-store이며, 토큰을 브라우저 저장소에 영구 보관하지 않습니다."
      responses:
        "200":
          description: 발급(또는 기존 토큰 재사용)
          content:
            application/json:
              schema:
                type: object
                required:
                  - csrfToken
                properties:
                  csrfToken:
                    type: string
        "403":
          description: ORIGIN_FORBIDDEN (허용되지 않은 Origin)
      x-confirmed: true
      x-path-proposed: false
  /api/auth/signup:
    post:
      tags:
        - auth
      operationId: A11_signup
      summary: A11 회원가입
      x-status: 협의완료 · 구현 완료
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                  maxLength: 64
                  description: 영문·숫자 조합 (H5)
      responses:
        "201":
          description: 가입 완료. 이메일 인증 전에는 로그인 불가
        "409":
          description: EMAIL_TAKEN (이미 가입된 이메일, core/errors.py)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
      x-confirmed: true
      x-path-proposed: false
  /api/auth/email/verify:
    post:
      tags:
        - auth
      operationId: A12_verifyEmail
      summary: A12 이메일 인증 확인
      x-status: 협의완료 · 구현 완료
      description: 링크 24시간, 1회만 사용
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - verificationToken
              properties:
                verificationToken:
                  type: string
      responses:
        "200":
          description: 인증 완료
        "400":
          description: TOKEN_INVALID (만료·이미 사용·없음을 구분하지 않음)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-confirmed: true
      x-path-proposed: false
  /api/auth/email/resend:
    post:
      tags:
        - auth
      operationId: A12_resendEmail
      summary: A12 인증 메일 재전송
      x-status: 협의완료 · 구현 완료
      description: 60초 간격, 하루 5회
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        "202":
          description: 접수(가입 여부를 알리지 않음)
        "429":
          description: RATE_LIMITED
      x-confirmed: true
      x-path-proposed: false
  /api/auth/login:
    post:
      tags:
        - auth
      operationId: A13_login
      summary: A13 로그인
      x-status: 협의완료 · 구현 완료
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: Access 15분. Refresh는 HttpOnly 쿠키(7일, 회전)로 별도 전달
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  expiresIn:
                    type: integer
                    example: 900
        "401":
          description: UNAUTHENTICATED (이메일·비밀번호 불일치)
        "429":
          description: RATE_LIMITED (15분 안에 5번 실패)
      x-confirmed: true
      x-path-proposed: false
  /api/auth/refresh:
    post:
      tags:
        - auth
      operationId: A14_refresh
      summary: A14 토큰 재발급
      x-status: 협의완료 · 구현 완료
      description: 본문 없음. Refresh 쿠키 + 출처 확인·지정 헤더로 CSRF 방어
      responses:
        "200":
          description: 재발급
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
        "401":
          description: REFRESH_INVALID (재사용 탐지·만료)
        "403":
          description: CSRF_INVALID / ORIGIN_FORBIDDEN
      x-confirmed: true
      x-path-proposed: false
  /api/auth/logout:
    post:
      tags:
        - auth
      operationId: A14_logout
      summary: A14 로그아웃
      x-status: 협의완료 · 구현 완료
      responses:
        "204":
          description: 로그아웃
      x-confirmed: true
      x-path-proposed: false
  /api/auth/password/reset-request:
    post:
      tags:
        - auth
      operationId: A15_resetRequest
      summary: A15 비밀번호 재설정 메일 요청
      x-status: 협의완료 · 구현 완료
      description: 가입 여부를 알리지 않고 항상 같은 응답
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        "202":
          description: 접수
      x-confirmed: true
      x-path-proposed: false
  /api/auth/password/reset:
    post:
      tags:
        - auth
      operationId: A15_resetPassword
      summary: A15 새 비밀번호 설정
      x-status: 협의완료 · 구현 완료
      description: 링크 30분·1회. 변경 시 모든 기기 로그아웃
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - resetToken
                - newPassword
              properties:
                resetToken:
                  type: string
                newPassword:
                  type: string
                  minLength: 8
                  maxLength: 64
      responses:
        "200":
          description: 변경 완료
        "400":
          description: TOKEN_INVALID (만료·이미 사용·없음을 구분하지 않음)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
      x-confirmed: true
      x-path-proposed: false
  /api/account:
    delete:
      tags:
        - account
      operationId: A16_deleteAccount
      summary: A16 회원 탈퇴
      x-status: 협의완료 · 구현 완료
      description: 비밀번호를 한 번 더 입력. 실제 삭제 확인 전에 "완료"라고 하지 않고, 부분 실패는 알림
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                password:
                  type: string
      responses:
        "200":
          description: 계정·세션·서버 체크리스트 삭제 결과. checklist는 서버 체크리스트 저장소(A17)가 연결된 앱이면 deleted(기록이 없어도 deleted), 연결되지 않은 앱이면 not_stored
          content:
            application/json:
              schema:
                type: object
                required:
                  - account
